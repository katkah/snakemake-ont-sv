# Test configuration for CI dry-run
# Points to tiny dummy files created during testing
# Do not use for real analysis

samples: "config/samples.test.tsv"
units:   "config/units.test.tsv"

comparison:
  activate:  true
  variable:  "condition"
  reference: "ctrl"
genome:   "test/data/genome.fa"
gap_file: "test/data/gaps.bed"

chromosomes:
  I: 15072434
  II: 15279421

sv_caller: "sniffles2"

min_sv_size: 50
min_support_reads: 3
min_inv_size: 1000
min_dup_size: 1000

truvari:
  refdist: 500
  pctseq: 0.7
  sizemax: 100000000

exclude_chroms: ["MtDNA"]

minimap2_preset: "map-ont"
minimap2_threads: 2
sniffles2_threads: 2
sniffles2_joint_call: false
nanovar_threads: 2
cutesv_threads: 2
cutesv_max_cluster_bias_ins: 100
cutesv_diff_ratio_merging_ins: 0.3
cutesv_max_cluster_bias_del: 100
cutesv_diff_ratio_merging_del: 0.3

mem_mb:
  align:           4096
  sniffles2:       4096
  sniffles2_joint: 4096
  nanovar:         4096
  cutesv:          4096
  compare:         4096
  split_reads:     4096
  sv_stats:        4096
  visualize:       4096
  nanoplot:        4096
  coverage:        4096
  multiqc:         4096
